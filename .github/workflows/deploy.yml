# ═══════════════════════════════════════════════════════════════════════════════
# NEXEAGLE WEBSITE — CI/CD Pipeline  (Next.js → Node container on GHCR)
# ═══════════════════════════════════════════════════════════════════════════════
#
#   Stage 1 — Build       npm ci + next build  (runs on push + PRs)
#   Stage 2 — Deploy      build Node image (next start) → push GHCR → run on VM
#             dev branch  -> Dev VM   (151.185.45.77) :82  -- public: https://nexeagle-dev.nexeagle.com
#             main branch -> Prod VM  (151.185.45.67) :8080 -- public: https://nexeagle.com
#
# The site is served on host port 8080 on Prod (port 80 is used by 1Rad easyrad
# UI there). On Dev, 8080 is already held by Watchtower's HTTP API (host-network
# mode, invisible to `docker ps --filter publish=`) — Dev uses :82 instead,
# following the existing convention on that VM (81=easyhms-web-dev, 83=cms-web-dev).
# A Caddy reverse proxy on the Dev VM terminates HTTPS for nexeagle-dev.nexeagle.com
# and forwards to localhost:82 -- the container itself still just publishes :82 as
# plain HTTP, unchanged; Caddy is the only thing that changed. The health check and
# PORT_HOG detection below deliberately keep testing the raw port directly (same
# reasoning Prod already follows for its own :8080), not the public domain, so a
# transient DNS/Caddy/cert hiccup can't fail a deploy that otherwise succeeded.
#
# ─────────────────────────────────────────────────────────────────────────────
# SECRETS (Settings → Secrets → Actions):
#   PROD_SSH_HOST         151.185.45.67
#   PROD_SSH_USER         root
#   PROD_SSH_KEY_B64      base64-encoded SSH private key for Prod App VM
#   EASYHMS_PROD_API_KEY  OPTIONAL — the public API doesn't require a key (see
#                         PublicApiKeyFilter), so this can be left unset and the site
#                         still works fully. Only set it if this deployment's traffic
#                         should be identified/revocable separately from anonymous
#                         callers. Issued via easyHMSAPI's tools/IssuePublicApiKey
#                         console tool (see easyHMSAPI/docs/OPS-ISSUE-PUBLIC-API-KEY.md).
#   SSH_HOST              151.185.45.77 (Dev App VM — legacy unprefixed name, predates the
#                         dev/prod split; password auth via appleboy/ssh-action, not a key)
#   SSH_USER              root
#   SSH_PASSWORD          SSH password for the Dev App VM
#   EASYHMS_DEV_API_KEY   OPTIONAL, same as EASYHMS_PROD_API_KEY, for the dev environment.
#   ANTHROPIC_API_KEY     OPTIONAL — powers the AI search fallback (app/api/search/parse).
#                         Same key used for both dev and prod. Leave unset to disable —
#                         search stays literal-keyword-only, no error, nothing breaks.
#                         NLP_ROUTER_BASE_URL (not a secret, hardcoded in the docker run below,
#                         same pattern as EASYHMS_API_BASE_URL) is tried BEFORE this — see the
#                         1HMS-NLP-Router repo. Anthropic remains the fallback for anything the
#                         NLP router can't confidently classify, so nothing here changes if
#                         that service is ever down.
#                         Dev's NLP_ROUTER_BASE_URL is still the raw http://151.185.45.77:5003 —
#                         NOT yet switched to https://nlp-api-dev.nexeagle.com (that subdomain's
#                         Caddy/DNS isn't resolving yet as of 2026-08-13). Switch it once
#                         `curl -I https://nlp-api-dev.nexeagle.com` actually succeeds — until
#                         then this is a deliberate, temporary mismatch with Prod's
#                         https://nlp-api.nexeagle.com, not an oversight.
#   INTERNAL_PROXY_SECRET OPTIONAL — lets easyHMSAPI's public rate limiters see each real
#                         visitor's IP instead of this container's own IP (every call to the
#                         API is server-to-server — see src/lib/api/server.ts). Same key used
#                         for both dev and prod; must match Internal:ProxyForwardingSecret in
#                         the easyHMSAPI repo's own deploy secrets exactly. Leave unset on
#                         either side to keep the previous (site-wide-budget) rate-limit
#                         behavior — nothing breaks either way.
# ═══════════════════════════════════════════════════════════════════════════════

name: NexEagle Website — CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: nexeagle-website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
# ═══════════════════════════════════════════════════════════════════════════════
  build:
    name: "Stage 1 — Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build (validation)
        run: npm run build

# ═══════════════════════════════════════════════════════════════════════════════
  deploy-dev:
    name: "Stage 2 — Deploy → Dev"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    environment: development

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image vars
        id: vars
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/nexeagle-website" >> "$GITHUB_OUTPUT"
          echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* vars are inlined at build time — LiveChat.tsx reads this to reach
          # CMSAPI's /chathub on the Dev VM (CMS API — CI/CD deploys CMSAPI to port 5002 there).
          # EASYHMS_API_BASE_URL is ALSO needed at build time here (not just via `docker run -e`
          # below) — see the Dockerfile comment: without it, the statically-generated specialty
          # pages silently bake in .env.production's PROD api url instead of Dev's.
          #
          # https://1hms-dev-api.nexeagle.com (NOT the raw 151.185.45.77:5001) -- the GitHub
          # Actions runner building this image could not reach the raw port directly (curl from
          # the runner got a bare connection failure, "status 0" -- almost certainly a firewall
          # on the VM only allowing 80/443 in from the open internet), which silently produced
          # mock-data static pages on every build until src/lib/api/server.ts stopped falling
          # back to mock data and started throwing instead, turning the invisible failure into a
          # hard build break. The HTTPS domain is a native (non-Docker) Caddy reverse proxy on
          # the Dev VM forwarding to localhost:5001 -- same pattern as
          # NLP Model/.github/workflows/setup-loc-dev-domain.yml's loc-dev.nexeagle.com, and
          # matches how prod's build-time EASYHMS_API_BASE_URL already uses
          # https://1hms-api.nexeagle.com instead of a raw port.
          build-args: |
            NEXT_PUBLIC_API_URL=http://151.185.45.77:5002
            EASYHMS_API_BASE_URL=https://1hms-dev-api.nexeagle.com
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}

      - name: Deploy to Dev VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          EASYHMS_API_KEY: ${{ secrets.EASYHMS_DEV_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROXY_SECRET: ${{ secrets.INTERNAL_PROXY_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          envs: IMAGE,PULL_TOKEN,ACTOR,EASYHMS_API_KEY,ANTHROPIC_API_KEY,PROXY_SECRET
          script: |
            set -e
            IMAGE_LC=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
            echo "$PULL_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            docker pull "$IMAGE_LC"
            docker rm -f nexeagle-website-dev 2>/dev/null || true
            PORT_HOG=$(docker ps -q --filter "publish=82")
            [ -n "$PORT_HOG" ] && docker rm -f $PORT_HOG || true

            # --add-host + host.docker.internal (not the VM's own public IP) for
            # EASYHMS_API_BASE_URL: this container runs on Docker's default bridge network
            # (-p 82:80, no --network host), and a bridge-network container generally can't
            # reach its own host's public IP/domain (NAT hairpin) -- unlike easyhms-api-dev,
            # which runs with --network host and so is directly reachable from outside. That
            # meant every server-side fetch() in this container to 151.185.45.77:5001 (its
            # own host) silently failed, and src/lib/api/server.ts's now-removed mock-data
            # fallback masked it completely -- every visitor saw 9 fake doctors with zero
            # visible error, on dev AND prod, for an extended period. host.docker.internal
            # (mapped to the real host gateway via host-gateway) reaches the host directly,
            # sidestepping the hairpin problem entirely. Port 5001 is the API's real bound
            # port on BOTH dev and prod (ASPNETCORE_URLS=http://+:5001, see easyHMSAPI's
            # deploy-api.yml) -- prod intentionally skips its public HTTPS domain here too,
            # since that's unnecessary indirection for a same-VM call.
            for i in 1 2 3 4 5; do
              if docker run -d --name nexeagle-website-dev --restart unless-stopped \
                  -p 82:80 \
                  --add-host=host.docker.internal:host-gateway \
                  -e EASYHMS_API_BASE_URL='http://host.docker.internal:5001' \
                  -e EASYHMS_API_KEY="$EASYHMS_API_KEY" \
                  -e EASYHMS_API_KEY_HEADER='X-Api-Key' \
                  -e ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
                  -e EASYHMS_TRUSTED_PROXY_SECRET="$PROXY_SECRET" \
                  -e NLP_ROUTER_BASE_URL='http://151.185.45.77:5003' \
                  "$IMAGE_LC"; then
                break
              fi
              echo "Port 82 still busy (attempt $i) — what's holding it:"
              (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null || true) | grep ':82 ' || echo "  (nothing found via ss/netstat)"
              docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
              if [ "$i" = 5 ]; then
                echo "Giving up after 5 attempts — see diagnostics above for what's actually on :82."
                exit 1
              fi
              sleep 3
              docker rm -f nexeagle-website-dev 2>/dev/null || true
            done
            docker image prune -f || true

      - name: Health check
        run: |
          sleep 5
          for i in 1 2 3 4 5; do
            S=$(curl -s -o /dev/null -w '%{http_code}' \
                http://${{ secrets.SSH_HOST }}:82 2>/dev/null || echo 000)
            echo "Attempt $i — HTTP $S"
            [ "$S" = "200" ] && echo "✅ NexEagle Website (dev) is live" && exit 0
            sleep 5
          done
          echo "⚠️ Health check inconclusive — check: docker logs nexeagle-website-dev"
          exit 0

      - name: Write summary
        if: always()
        run: |
          echo "## 🌐 NexEagle Website — Dev" >> $GITHUB_STEP_SUMMARY
          [ "${{ job.status }}" = "success" ] \
            && echo "**Status:** ✅ Live at https://nexeagle-dev.nexeagle.com (container health-checked directly on :82)" >> $GITHUB_STEP_SUMMARY \
            || echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

# ═══════════════════════════════════════════════════════════════════════════════
  deploy-prod:
    name: "Stage 2 — Deploy → Prod"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image vars
        id: vars
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/nexeagle-website" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* vars are inlined at build time — LiveChat.tsx reads this to reach
          # CMSAPI's /chathub. HTTPS + a real domain, not the raw IP:5002 — this page is served
          # over HTTPS (https://1hms.nexeagle.com), and browsers block a plain-http WebSocket/XHR
          # connection from an https page ("mixed content"). Requires cms-api.nexeagle.com to be
          # reverse-proxied to the Prod VM's :5002 with a valid TLS cert (see CMSAPI repo notes).
          # EASYHMS_API_BASE_URL is ALSO needed at build time here (not just via the SSH deploy
          # step below) — see the Dockerfile comment: this happens to already match what
          # .env.production bakes in by default, which is why this side of the bug was invisible.
          build-args: |
            NEXT_PUBLIC_API_URL=https://cms-api.nexeagle.com
            EASYHMS_API_BASE_URL=https://1hms-api.nexeagle.com
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.PROD_SSH_KEY_B64 }}" | base64 -d > "$GITHUB_WORKSPACE/deploy_key"
          # appleboy/ssh-action reads this file from INSIDE its own Docker container, as a
          # different UID than the runner that wrote it — chmod 600 locks it to the runner's own
          # UID and the container gets EACCES ("permission denied") trying to open it. Go's SSH key
          # parser does no permission-strictness check of its own (unlike the OpenSSH CLI), so
          # world-readable is safe here; the file only exists briefly on an ephemeral CI runner.
          chmod 644 "$GITHUB_WORKSPACE/deploy_key"

      - name: Deploy to Prod VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          EASYHMS_API_KEY: ${{ secrets.EASYHMS_PROD_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROXY_SECRET: ${{ secrets.INTERNAL_PROXY_SECRET }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          # appleboy/ssh-action runs inside its own Docker container, which only mounts the
          # checked-out workspace (not /tmp on the runner) — the key file must live here, not
          # in /tmp, or getKeyFile fails with "no such file or directory" (see incident 2026-07-20).
          key_path: deploy_key
          port: 22
          command_timeout: 10m
          envs: IMAGE,PULL_TOKEN,ACTOR,EASYHMS_API_KEY,ANTHROPIC_API_KEY,PROXY_SECRET
          script: |
            set -e
            IMAGE_LC=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
            echo "$PULL_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            docker pull "$IMAGE_LC"
            docker rm -f nexeagle-website 2>/dev/null || true
            PORT_HOG=$(docker ps -q --filter "publish=8080")
            [ -n "$PORT_HOG" ] && docker rm -f $PORT_HOG || true

            # Same host.docker.internal fix as the dev job above -- see that block's comment.
            # This container previously tried to reach https://1hms-api.nexeagle.com (which
            # resolves back to THIS SAME Prod VM), hit the identical bridge-network NAT
            # hairpin failure, and silently served mock doctor data to every real visitor.
            for i in 1 2 3 4 5; do
              if docker run -d --name nexeagle-website --restart unless-stopped \
                  -p 8080:80 \
                  --add-host=host.docker.internal:host-gateway \
                  -e EASYHMS_API_BASE_URL='http://host.docker.internal:5001' \
                  -e EASYHMS_API_KEY="$EASYHMS_API_KEY" \
                  -e EASYHMS_API_KEY_HEADER='X-Api-Key' \
                  -e ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
                  -e EASYHMS_TRUSTED_PROXY_SECRET="$PROXY_SECRET" \
                  -e NLP_ROUTER_BASE_URL='https://nlp-api.nexeagle.com' \
                  "$IMAGE_LC"; then
                break
              fi
              echo "Port 8080 still busy (attempt $i) — what's holding it:"
              (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null || true) | grep ':8080' || echo "  (nothing found via ss/netstat)"
              docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
              if [ "$i" = 5 ]; then
                echo "Giving up after 5 attempts — see diagnostics above for what's actually on :8080."
                exit 1
              fi
              sleep 3
              docker rm -f nexeagle-website 2>/dev/null || true
            done
            docker image prune -f || true

      - name: Health check
        run: |
          sleep 5
          for i in 1 2 3 4 5; do
            S=$(curl -s -o /dev/null -w '%{http_code}' \
                http://${{ secrets.PROD_SSH_HOST }}:8080 2>/dev/null || echo 000)
            echo "Attempt $i — HTTP $S"
            [ "$S" = "200" ] && echo "✅ NexEagle Website is live" && exit 0
            sleep 5
          done
          echo "⚠️ Health check inconclusive — check: docker logs nexeagle-website"
          exit 0

      - name: Write summary
        if: always()
        run: |
          echo "## 🌐 NexEagle Website — Prod" >> $GITHUB_STEP_SUMMARY
          [ "${{ job.status }}" = "success" ] \
            && echo "**Status:** ✅ Live at http://${{ secrets.PROD_SSH_HOST }}:8080" >> $GITHUB_STEP_SUMMARY \
            || echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
